name: Deploy site

on:
  push:
    branches: [main-v2]
    paths: ['site/**', 'release-notes/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth_scheme='Bearer'
          auth_header="Authorization: ${auth_scheme} ${GH_TOKEN}"
          set +e
          status_code="$(curl -sS -o /tmp/pages-response.json -w '%{http_code}' \
            -H "${auth_header}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          curl_status="$?"
          set -e

          if [ "${curl_status}" != "0" ]; then
            echo "::error::Failed to query GitHub Pages status: curl exited with code ${curl_status}."
            exit 1
          fi

          if [ "${status_code}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${status_code}" = "404" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping deploy: GitHub Pages is not enabled for ${GITHUB_REPOSITORY}."
            exit 0
          fi

          if [ "${status_code}" = "403" ]; then
            echo "::error::Failed to check GitHub Pages status (HTTP 403): token lacks access or API rate limit exceeded."
            exit 1
          fi

          echo "::error::Failed to check GitHub Pages status (HTTP ${status_code})."
          exit 1
      - id: deploy
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
