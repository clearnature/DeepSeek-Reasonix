name: Deploy site

on:
  push:
    branches: [main-v2]
    paths: ['site/**', 'release-notes/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages-response.json 2> /tmp/pages-error.txt
          gh_status="$?"
          set -e

          if [ "${gh_status}" = "0" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          response_error="$(cat /tmp/pages-error.txt)"

          if grep -q 'HTTP 404' /tmp/pages-error.txt; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping deploy: GitHub Pages is not enabled for ${GITHUB_REPOSITORY}."
            exit 0
          fi

          if grep -q 'HTTP 403' /tmp/pages-error.txt; then
            echo "::error::Failed to check GitHub Pages status (HTTP 403): token lacks access or API rate limit exceeded. Response: ${response_error}"
            exit 1
          fi

          echo "::error::Failed to check GitHub Pages status. Response: ${response_error}"
          exit 1
      - id: deploy
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
