name: Deploy site

on:
  push:
    branches: [main-v2]
    paths: ['site/**', 'release-notes/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if response="$(gh api -i "repos/${GITHUB_REPOSITORY}/pages" 2>&1)"; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Fq 'HTTP 404' <<<"$response"; then
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for ${GITHUB_REPOSITORY}; skipping artifact upload and deployment."
            exit 0
          fi
          echo "$response" >&2
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
      - if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    if: ${{ needs.build.outputs.pages_enabled == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
